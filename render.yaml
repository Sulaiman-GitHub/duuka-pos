# Render Blueprint: one web service + one Postgres database, created together.
# Free plan notes: the web service sleeps after ~15 min idle (first request then takes ~1 min), and a free Render database
# expires after 30 days. Fine for testing; switch both plans to "starter" or higher before real shops use it.
# NOTE: no database is declared here on purpose. Render allows only one free Postgres per account, so this blueprint
# expects DATABASE_URL to be supplied (a new Neon database, or a Render Postgres on a paid plan). Never point it at a
# database that another application uses.

services:
  - type: web
    name: duuka-pos
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build:app
    # Migrations and the first platform-owner account are applied on every start (safe to repeat).
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATFORM_OWNER_EMAIL
        sync: false
      - key: PLATFORM_OWNER_PASSWORD
        sync: false
      - key: PLATFORM_OWNER_NAME
        sync: false
