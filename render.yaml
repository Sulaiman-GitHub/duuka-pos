# Render Blueprint: one web service + one Postgres database, created together.
# Free plan notes: the web service sleeps after ~15 min idle (first request then takes ~1 min), and the free database
# expires after 30 days. Fine for testing; switch both plans to "starter" or higher before real shops use it.
databases:
  - name: duuka-db
    plan: free
    databaseName: duuka
    user: duuka
    region: frankfurt

services:
  - type: web
    name: duuka-pos
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build:app
    # Migrations and the first platform-owner account are applied on every start (safe to repeat).
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: duuka-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATFORM_OWNER_EMAIL
        sync: false
      - key: PLATFORM_OWNER_PASSWORD
        sync: false
      - key: PLATFORM_OWNER_NAME
        sync: false
